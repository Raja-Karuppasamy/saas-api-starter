---
# Separate secrets by service/purpose
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: default
type: Opaque
stringData:  # ← Uses stringData (auto base64 encodes)
  username: postgres
  password: supersecretpassword123
  host: shinkansen.proxy.rlwy.net
  port: "43705"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: default
type: Opaque
stringData:
  openai: sk-proj-abc123...
  stripe: sk_test_xyz789...
---
# For TLS certificates (special type)
apiVersion: v1
kind: Secret
metadata:
  name: app-tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDXTCCAkWgAwIBAgIJAKT...
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    MIIEvQIBADANBgkqhkiG9w0...
    -----END PRIVATE KEY-----
