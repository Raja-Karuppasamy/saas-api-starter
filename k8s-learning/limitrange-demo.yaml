apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: demo-quota
spec:
  limits:
  - type: Container
    default:           # Default limits (if not specified)
      cpu: 200m
      memory: 256Mi
    defaultRequest:    # Default requests (if not specified)
      cpu: 100m
      memory: 128Mi
    max:               # Maximum allowed
      cpu: 1000m
      memory: 1Gi
    min:               # Minimum required
      cpu: 50m
      memory: 64Mi
