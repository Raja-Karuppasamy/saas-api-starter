---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quickai-readonly
  namespace: default
---
# Role: Can read pods, deployments, services
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quickai-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
# RoleBinding: Bind role to service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quickai-readonly-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: quickai-readonly
    namespace: default
roleRef:
  kind: Role
  name: quickai-reader
  apiGroup: rbac.authorization.k8s.io
