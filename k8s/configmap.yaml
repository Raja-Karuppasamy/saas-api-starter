apiVersion: v1
kind: ConfigMap
metadata:
  name: quickai-config
  namespace: default
data:
  # Application settings
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_VERSION: "v1"
  
  # Feature flags
  ENABLE_RATE_LIMITING: "true"
  ENABLE_CACHING: "false"
  
  # External service endpoints
  REDIS_HOST: "redis.example.com"
  REDIS_PORT: "6379"
  
  # App configuration
  MAX_UPLOAD_SIZE: "10485760"
  SESSION_TIMEOUT: "3600"
